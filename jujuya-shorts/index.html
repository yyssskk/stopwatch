<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "JUJU";
        src: url("assets/fonts/malgunbd.ttf"), local("Malgun Gothic Bold"), local("MalgunGothicBold");
        font-weight: 700;
      }
      :root {
        --ground: #1d2238;
        --font-display: "JUJU";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #dots {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="dots" class="clip" data-start="0" data-duration="30" data-track-index="0" width="1080" height="1920"></canvas>
      <audio id="music" data-start="0" data-duration="30" data-track-index="1" data-volume="1" src="assets/music.wav"></audio>
    </div>
    <script>
      // Everything on screen is dots: a pointillist sky plus kinetic words sampled into dots.
      const W = 1080, H = 1920, CELL = 6, BEAT = 0.5;
      const cv = document.getElementById("dots"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas");
      off.width = W / CELL; off.height = H / CELL;
      const oc = off.getContext("2d", { willReadFrequently: true });

      const hash = (a, b, c) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const outBack = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
      const outExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
      const mix = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

      // Kinetic cues: text, in/out seconds, centre y, size (px), colour, entrance, tilt (deg)
      const CUES = [
        { text: "금요일", t0: 0, t1: 3, y: 470, size: 150, color: "#9fb4ff", fx: "pop", rot: -4 },
        { text: "17:59", t0: 0, t1: 3, y: 790, size: 290, color: "#ffffff", fx: "tick" },
        { text: "퇴근 1분 전…", t0: 0.6, t1: 3, y: 1070, size: 90, color: "#c9d3ff", fx: "pop" },
        { text: "18:00", t0: 3, t1: 5, y: 700, size: 320, color: "#ffe14d", fx: "slam" },
        { text: "퇴근!", t0: 4, t1: 5, y: 1050, size: 230, color: "#ff5d8f", fx: "slam", rot: 6 },
        { text: "아", t0: 5, t1: 9, y: 500, size: 300, color: "#ffffff", fx: "slam", shake: 1 },
        { text: "줴줴", t0: 5.5, t1: 9, y: 830, size: 380, color: "#ffe14d", fx: "slam", shake: 1.4, rot: -6 },
        { text: "이야~!!", t0: 6, t1: 9, y: 1140, size: 230, color: "#4df0ff", fx: "slam", shake: 1, rot: 4 },
        { text: "노트북", t0: 9, t1: 11, y: 620, size: 230, color: "#ffffff", fx: "fromLeft" },
        { text: "탁! 덮고", t0: 9.5, t1: 11, y: 920, size: 210, color: "#ffe14d", fx: "slam", rot: -5 },
        { text: "넥타이", t0: 11, t1: 13, y: 620, size: 230, color: "#ffffff", fx: "fromRight" },
        { text: "스르륵 풀고", t0: 11.5, t1: 13, y: 920, size: 170, color: "#4df0ff", fx: "wave" },
        { text: "치킨?", t0: 13, t1: 17, y: 470, size: 220, color: "#ffb347", fx: "pop", rot: -8 },
        { text: "맥주?", t0: 14, t1: 17, y: 760, size: 220, color: "#ffe14d", fx: "pop", rot: 7 },
        { text: "둘 다!!", t0: 15, t1: 17, y: 1070, size: 250, color: "#ff5d8f", fx: "slam", shake: 0.8 },
        { text: "알람", t0: 17, t1: 19, y: 640, size: 260, color: "#ffffff", fx: "pop" },
        { text: "OFF", t0: 17.5, t1: 19, y: 960, size: 330, color: "#ff5d8f", fx: "slam", rot: -4 },
        { text: "늦잠", t0: 19, t1: 21, y: 640, size: 280, color: "#c9b3ff", fx: "wave" },
        { text: "확정", t0: 19.5, t1: 21, y: 960, size: 280, color: "#ffe14d", fx: "slam", rot: 5 },
        { text: "행복한", t0: 21, t1: 26, y: 520, size: 230, color: "#ffffff", fx: "fromLeft" },
        { text: "주말", t0: 21.5, t1: 26, y: 800, size: 340, color: "#ffe14d", fx: "slam" },
        { text: "준비", t0: 23, t1: 26, y: 1060, size: 170, color: "#4df0ff", fx: "pop", rot: -6 },
        { text: "완료!", t0: 23.75, t1: 26, y: 1060, size: 170, color: "#ff5d8f", fx: "pop", rot: 6, dx: 0 },
        { text: "아 줴줴", t0: 26, t1: 29, y: 650, size: 290, color: "#ffe14d", fx: "slam", shake: 1.4, rot: -5 },
        { text: "이야~!!!", t0: 26.5, t1: 29, y: 950, size: 250, color: "#4df0ff", fx: "slam", shake: 1, rot: 4 },
        { text: "행복한 주말", t0: 29, t1: 30.2, y: 700, size: 170, color: "#ffffff", fx: "pop" },
        { text: "되세요!", t0: 29.15, t1: 30.2, y: 920, size: 200, color: "#ffe14d", fx: "pop", rot: -4 },
      ];
      // "준비" and "완료!" share a line: offset them side by side
      CUES[21].dx = -200; CUES[22].dx = 230;

      // Sky palettes (top, mid, bottom): office dusk before 18:00, party sunset after.
      const OFFICE = ["#1d2a4a", "#2e3f66", "#45507a"].map(hex);
      const SUNSET = ["#ff7a3d", "#ff3d77", "#5b2a8f"].map(hex);
      const NIGHT = ["#3a1f7a", "#c2367e", "#ff8a3d"].map(hex);

      function skyAt(y, t) {
        const pal = (p) => (y < 0.5 ? mix(p[0], p[1], y * 2) : mix(p[1], p[2], (y - 0.5) * 2));
        const a = pal(OFFICE), b = pal(SUNSET), c = pal(NIGHT);
        const s1 = clamp((t - 2.9) / 0.4), s2 = clamp((t - 17) / 4);
        return mix(mix(a, b, s1), c, s2);
      }

      function drawSky(t) {
        const pulse = t >= 3 ? Math.exp(-((t % BEAT) / BEAT) * 5) : 0.4 * Math.exp(-((t % BEAT) / BEAT) * 8);
        const S = 22;
        for (let j = 0; j < H / S + 1; j++) {
          for (let i = 0; i < W / S + 1; i++) {
            const h1 = hash(i, j, 1), h2 = hash(i, j, 2), h3 = hash(i, j, 3);
            const x = i * S + (j % 2) * S * 0.5 + (h1 - 0.5) * 8;
            const y = j * S + (h2 - 0.5) * 8 + Math.sin(t * 1.3 + i * 0.4) * 2;
            const base = skyAt(y / H, t);
            // pointillist trick: neighbouring dots swing warmer or cooler around the local colour
            const k = (h3 - 0.5) * 70;
            const col = [base[0] + k, base[1] + k * 0.3 - 10 * h1, base[2] - k * 0.6 + 20 * h2];
            const r = 4.2 + h1 * 4 + pulse * 2.4 * h2;
            ctx.fillStyle = `rgb(${col.map((v) => clamp(v, 0, 255) | 0).join(",")})`;
            ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
          }
        }
      }

      function cueTransform(c, t) {
        const age = t - c.t0, left = c.t1 - t;
        let sx = 1, x = W / 2 + (c.dx || 0), y = c.y, rot = (c.rot || 0) * Math.PI / 180;
        const p = clamp(age / 0.3);
        if (c.fx === "slam") sx = 1 + 1.4 * (1 - outExpo(clamp(age / 0.18)));
        if (c.fx === "pop") sx = outBack(p);
        if (c.fx === "fromLeft") x -= (1 - outExpo(p)) * 900;
        if (c.fx === "fromRight") x += (1 - outExpo(p)) * 900;
        if (c.fx === "wave") y += Math.sin(age * 9) * 14;
        if (c.shake) {
          const amp = c.shake * 18 * Math.exp(-((t % BEAT) / BEAT) * 4);
          x += (hash(Math.floor(t * 30), 1, 9) - 0.5) * amp * 2;
          y += (hash(Math.floor(t * 30), 2, 9) - 0.5) * amp * 2;
        }
        // beat bounce for every word once it has landed
        sx *= 1 + 0.05 * Math.exp(-((t % BEAT) / BEAT) * 6) * clamp(age / 0.4);
        return { x, y, sx, rot, enter: clamp(age / 0.35), exit: clamp(1 - left / 0.25) };
      }

      function cueText(c, t) {
        if (c.fx !== "tick") return c.text;
        return Math.floor(t * 2) % 2 ? "17 59" : "17:59";
      }

      function drawCue(c, ci, t) {
        const T = cueTransform(c, t);
        oc.clearRect(0, 0, off.width, off.height);
        oc.save();
        oc.translate(T.x / CELL, T.y / CELL);
        oc.rotate(T.rot);
        oc.scale(T.sx, T.sx);
        oc.font = `700 ${c.size / CELL}px JUJU, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
        oc.textAlign = "center"; oc.textBaseline = "middle";
        oc.fillStyle = c.color;
        oc.fillText(cueText(c, t), 0, 0);
        oc.restore();
        const img = oc.getImageData(0, 0, off.width, off.height).data;
        const ow = off.width;
        const dots = [];
        for (let j = 0; j < off.height; j++) {
          for (let i = 0; i < ow; i++) {
            const k = (j * ow + i) * 4;
            if (img[k + 3] < 110) continue;
            const h1 = hash(i, j, ci), h2 = hash(j, i, ci + 50), h3 = hash(i + j, ci, 7);
            let x = i * CELL + CELL / 2 + (h1 - 0.5) * 3;
            let y = j * CELL + CELL / 2 + (h2 - 0.5) * 3;
            // assemble from a scattered cloud, then burst outward on exit
            const ang = h3 * 6.2832, far = 260 + h1 * 520;
            const a = 1 - outBack(T.enter) , e = T.exit * T.exit;
            x += Math.cos(ang) * far * (a + e * 1.6);
            y += Math.sin(ang) * far * (a + e * 1.6) - e * 200;
            const lum = (h2 - 0.5) * 70;
            const col = [img[k] + lum, img[k + 1] + lum, img[k + 2] + lum * 0.5].map((v) => clamp(v, 0, 255) | 0);
            const r = (3.3 + h1 * 1.6) * (1 - T.exit * 0.6);
            dots.push(x, y, r, col);
          }
        }
        // offset shadow dots first for depth, then the coloured dots
        ctx.fillStyle = "rgba(20,10,40,0.55)";
        for (let n = 0; n < dots.length; n += 4) { ctx.beginPath(); ctx.arc(dots[n] + 7, dots[n + 1] + 9, dots[n + 2], 0, 6.2832); ctx.fill(); }
        for (let n = 0; n < dots.length; n += 4) {
          ctx.fillStyle = `rgb(${dots[n + 3].join(",")})`;
          ctx.beginPath(); ctx.arc(dots[n], dots[n + 1], dots[n + 2], 0, 6.2832); ctx.fill();
        }
      }

      // Confetti bursts of fat dots on the big moments
      const BURSTS = [3, 5, 6, 15, 17.5, 21.5, 26, 26.5, 29];
      const CONF = ["#ffe14d", "#ff5d8f", "#4df0ff", "#ffffff", "#ffb347", "#9dff6a"];
      function drawConfetti(t) {
        BURSTS.forEach((b, bi) => {
          const age = t - b;
          if (age < 0 || age > 1.6) return;
          for (let n = 0; n < 70; n++) {
            const ang = hash(n, bi, 3) * 6.2832, sp = 500 + hash(n, bi, 4) * 1100;
            const d = sp * (1 - Math.exp(-age * 3)) / 3;
            const x = W / 2 + Math.cos(ang) * d;
            const y = 800 + Math.sin(ang) * d + 260 * age * age;
            const r = (6 + hash(n, bi, 5) * 12) * (1 - age / 1.6);
            ctx.fillStyle = CONF[n % CONF.length];
            ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
          }
        });
      }

      function draw(t) {
        ctx.fillStyle = "#14182a";
        ctx.fillRect(0, 0, W, H);
        drawSky(t);
        drawConfetti(t);
        CUES.forEach((c, ci) => { if (t >= c.t0 && t < c.t1) drawCue(c, ci + 1, t); });
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 30, duration: 30, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.font = document.fonts.load("700 60px JUJU").catch(() => {}).then(() => draw(tl.time()));
      tl.seek(0);
    </script>
  </body>
</html>
